[tool.ruff]
# Keep in step with the `version:` pinned in the ruff job in .github/workflows/ci.yml.
required-version = "==0.17.2"
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
# The tests' own modules are first-party, so they share one section instead of
# landing among third-party imports (test_* covers modules like test_ledger that
# other tests import).
known-first-party = [
    "agents_helpers",
    "agents_md_inventory",
    "agents_md_limits",
    "docs_inventory",
    "helpers",
    "items",
    "review_state",
    "prstate",
    "runstate",
    "watcher",
    "run",
    "fakes",
    "test_*",
]
# Still needed: tests import `helpers` before `review_state`, because helpers puts
# the scripts dir on sys.path. Isort's default puts `import x` above `from x
# import`, which would load review_state first; sorting by module name instead
# keeps helpers < review_state < test_*.
force-sort-within-sections = true
