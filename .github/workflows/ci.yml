name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for dir in plugins/*/; do
            [ -d "$dir/.claude-plugin" ] || continue
            claude plugin validate "$dir"
          done

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Ruff version: keep in step with `required-version` in pyproject.toml.
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: check
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.2"
          args: format --check

  test:
    name: test (${{ matrix.python-version || matrix.python-version-file }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Python, on an image pinned so a later runner
          # without a 3.9 build cannot break it; and the pinned version, which
          # is also the newest.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version-file: .python-version
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          python-version-file: ${{ matrix.python-version-file }}
      - name: Run plugin tests
        run: |
          for dir in plugins/*/tests; do
            [ -d "$dir" ] || continue
            python3 -m unittest discover -s "$dir" -v
          done

  # The required PR check. Runs even when a dependency fails or is skipped, so
  # the check never reports as skipped (which branch protection treats as passing).
  ci:
    if: always()
    needs: [validate, ruff, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
